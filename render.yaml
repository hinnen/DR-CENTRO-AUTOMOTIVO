# Blueprint Render — DR Centro Automotivo
# Não misturar com Agro / SistVale.

databases:
  - name: dr-centro-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: dr-centro-automotivo
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 180
    healthCheckPath: /healthz
    disk:
      name: dr-centro-media
      mountPath: /var/data/media
      sizeGB: 5
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dr-centro-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,drcentroautomotivo.com,www.drcentroautomotivo.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://dr-centro-automotivo.onrender.com,https://drcentroautomotivo.com,https://www.drcentroautomotivo.com"
      - key: WORKSHOP_NAME
        value: "DR Centro Automotivo"
      - key: USE_MANIFEST_STATIC
        value: "False"
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: USE_X_FORWARDED_PROTO
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
